# TALOS baseline scenario.
#
# Units are SI unless the key's suffix says otherwise; the loader converts
# suffixed keys to the SI field, e.g. *_deg -> *_rad, *_km -> *_m, *_kw -> *_w,
# *_kwh -> *_j, *_ft2 -> *_m2, *_hours / *_days -> *_s, *_c -> *_k (deg C -> K).
# Any key may also be given in its SI form. Unknown keys are an error.
#
# Basis tags: [sourced] research pass value; [derived] computed from sourced
# inputs; [pick] design choice made for this baseline; [guess] placeholder.

[run]
name = "baseline"
epoch = 2026-12-21T00:00:00Z   # [pick] winter solstice: worst eclipse for a 06:00 LTAN
duration_days = 1.0
seed = 0
stochastic = true              # sample eta1 / thrust angle / jitter per burst
score = "removal_progress"     # removal_progress | closest_to_removal | dv_per_energy
dt_s = 1.0                     # fine screening step
chunk_s = 600.0                # scheduling chunk; each object engaged at most once per chunk
checkpoint_days = 30.0         # full-state checkpoint (runs with an out_dir): resume / extend later
predict_pulse_stride = 1       # scheduler predicts every n-th pulse; 5-10 is only ~13 % faster and
                               # shifts dv/engagement +4-5 % (3-day check, ~seed noise): keep exact

[constellation]
n_sats = 4
altitudes_km = [700.0, 800.0, 900.0]   # round-robin shells, evenly phased in mean anomaly
ltan_hours = 6.0               # [pick] dawn-dusk, ascending node at 06:00 (eclipse season Nov-Jan)

[population]
kind = "ordem"                 # [sourced] NASA ORDEM 3.2 table (scripts/build_ordem_table.py); "toy" = uniform stand-in
# ordem_year = 2026            # default: the epoch's year; table src/talos/data/ordem_<year>.npz (gitignored)
# n_samples = 20000            # default: full density, one sample per real object (~76k for 2026)
# materials = ["NK", "LD", "MD", "HD", "IN"]   # ORDEM classes; default all
n_real = 100000                # toy only ([guess] Phipps ~100k); ORDEM 2026 gives ~76k 1-10 cm in 600-1000 km
alt_km = [600.0, 1000.0]
areal_density = 1.0            # kg/m^2, used when areal_density_model = "fixed" (sweep 0.2, 1, 10)
areal_density_model = "sbm"    # [sourced] NASA std breakup model A/m (mu = 1/(A/m); median ~2 kg/m^2 at 1 cm,
                               # ~10 above 5.6 cm), NaK droplets as spheres | fixed | sphere (2/3 rho d); ordem only
                               # alternatives (ordem only): "hanada" = Hanada two-material A/m mixture
                               # (Olivieri & Francesconi, SDC9 paper 161, Eqs. 10-15; much lighter low-density
                               # class), "hanada_material" = the same curves assigned by the ORDEM LD class
min_lifetime_yr = 1.0          # drop objects that re-enter within a year anyway
albedo_median = 0.1            # [pick] Lambertian geometric albedo (debris ~0.1-0.2)
albedo_log_sigma = 0.5         # [pick] lognormal spread per object, clipped 0.02-0.6
albedo_model = "fixed"         # fixed (albedo_median) | proof: [sourced] PROOF/MASTER medians, fragments 0.2,
                               # NaK 0.85 (MLI 0.56, not separable in ORDEM) via Filho et al., SDC9 paper 14

[planner]
enabled = false                # receding-horizon commitment planner (did not beat greedy)
max_committed = 200
horizon_hours = 6.0
min_dv_frac = 0.25
quality = 0.8
probe_s = 10.0

[laser]
wavelength_nm = 355.0
pulse_width_ps = 100.0
aperture_d_m = 1.5
m2 = 2.0
beam_a = 1.27
prf_hz = 33.0
burst_power_kw = 25.0          # optical, while firing
eta2 = 0.40                    # [sourced] backed out of L'ADROIT (sweep 0.3-0.67)

[atp]
detection_range_km = 800.0
engage_range_min_km = 100.0
engage_range_max_km = 500.0
slew_rate_limit_deg_s = 2.0
field_of_regard_half_angle_deg = 180.0   # [guess] unrestricted
earth_clearance_alt_km = 100.0
jitter_urad = 0.3
settle_s = 5.0                 # [guess] retarget + acquisition, not overlapped with recovery
require_target_sunlit = true   # [pick] passive optical tracking of reflected sunlight
sun_exclusion_deg = 30.0       # [pick] LOS-to-sun keep-out (30-45 typical, unsourced)
# detection & tracking (applied when [sun] is enabled)
detection_model = "passive_optical"  # passive_optical | ideal (every geometric window engageable)
detect_mag_limit = 16.0        # [pick] wide-field acquisition sensor, streaking targets
track_mag_limit = 18.0         # [pick] 1.5 m aperture closed-loop track
earth_background_penalty_mag = 3.0   # [pick] sunlit Earth behind the target
acquisition_s = 10.0           # [pick] continuous detection needed before a track exists

[resources]
# power
array_area_ft2 = 1600.0
array_specific_power_w_m2 = 250.0   # EOL [sourced range 200-300]; degradation unsourced
wallplug_eff = 0.10            # [derived] 0.90 x 0.55 x 0.45 x 0.40; range 0.04-0.17
bus_power_kw = 1.5             # [guess] dissipated into the thermal node
battery_capacity_kwh = 2.0     # [guess]
battery_rt_eff = 0.85          # [sourced, weak] 0.80-0.90; discharge losses become heat
# storage cycle life N(DoD) = cycles_100 * DoD^-exponent (Li-ion picks; presets in
# talos.platform.STORAGE_PRESETS: li_ion / lto / supercap)
storage_cycles_100 = 5000.0    # [pick]
storage_cycle_exponent = 1.7   # [pick]
storage_specific_energy_wh_kg = 120.0  # [pick] pack level
burst_s = 10.0                 # longest burst (also cut by resources and the target window)
# ready_burst_s = 10.0         # wait for this burst length after each burst (default burst_s,
                               # capped at 95 % of what a full battery + cold store allow)
min_burst_s = 5.0              # [guess]
# radiator: q_net = fin * sides * [eps sigma T^4 - eps F_E IR - alpha albedo - other]
radiator_area_m2 = 20.0        # [pick] dominant design choice: 20 m2 -> ~2.9 % duty
radiator_sides = 2
radiator_emissivity = 0.90     # [sourced] Z-93 / AZ-93
radiator_absorptivity = 0.20   # [pick] 0.16 BOL; EOL unsourced
radiator_earth_view = 0.22     # [derived] per side, panel plane containing nadir
earth_ir_w_m2 = 237.0          # [sourced]
radiator_other_load_w_m2 = 5.0 # [pick] residual sun leakage, edge-on to the sun
fin_efficiency = 0.85          # [sourced] 0.8-0.9
radiator_dT_k = 8.0            # [sourced] store -> radiator, pumped two-phase (LHP ~20 K)
radiator_turndown_min = 0.10   # [pick] louvers/bypass floor before heaters are needed
# thermal store (PCM + loop, one lumped node)
pcm_melt_c = 15.0              # [pick] below a ~20 C diode loop; salt-hydrate class, unsourced
pcm_mass_kg = 25.0             # [pick] ~1.3 bursts of latent capacity
pcm_specific_kj_kg = 120.0     # [sourced] system level incl. fins/container (50-170)
heat_capacity_mj_k = 0.5       # [guess] laser head + loop sensible (0.2-1)
t_min_c = 10.0                 # [pick] heater floor
t_max_c = 17.0                 # [pick] stop firing above this

[ablation]
cm_n_per_mw = 50.0             # [sourced] peak coupling (sweep 25-100). Measured: 7-40 uN s/J by material and
                               # roughness (Keil+ 2023, 10 ns 1064 nm); Al 50-320 by surface, organics to 300
                               # (Phipps+ 2012); rep-rated pulses "up to 3x reduced coupling" vs single-shot
                               # data (NASA OTPS 2024). No ps / UV measurement found for any debris material.
threshold_fluence_kj_m2 = 4.5  # [sourced]
phi_opt_kj_m2 = 8.5            # [sourced]
cm_model = "plasma"            # plasma | constant
plasma_exponent = 0.25         # [sourced]
eta1_mean = 0.3                # [sourced] Phipps+ 2012 eta_c = 0.3 "after Liedahl" (plate ~1/3 of a sphere)
eta1_basis = "along_beam"      # [sourced] eta1 already includes improper thrust direction (Phipps Eq. 6);
                               # "magnitude" = pre-2026-11-09 double count with cos(45 deg)
eta1_kappa = 10.0              # [guess] spread
off_axis_mean_deg = 45.0       # [sourced] with along_beam it sets only the sideways scatter
off_axis_sigma_deg = 15.0      # [guess] spread
attitude_model = "per_pulse"   # [pick] per_pulse | per_burst (slow tumble: eta1 / thrust direction fixed per burst)
# Cm relative to nominal by ORDEM material class [pick: all 1 = no material dependence; 0 = immune].
# Direction sourced, size not: CFRP ~80 uN s/J above ~2 J/cm2, several times metal, threshold ~1/4 of
# metal (SPIE 13699, 1064/532/355 nm, ns) -> ld > md; no ps / UV data per class.
cm_scale_nk = 1.0              # NaK droplets (liquid metal spheres): unknown
cm_scale_ld = 1.0              # low density (< 2 g/cm3: plastics, MLI, composites)
cm_scale_md = 1.0              # medium density (aluminium); Al 10-40 uN/W "under optimum irradiation" (Scholl, SDC9 paper
                               # 307, citing Phipps 2011; ns / IR) vs 50 nominal: 0.2-0.8 if UV / ps behaves alike
cm_scale_hd = 1.0              # high density (steel, copper)
cm_scale_in = 1.0              # intact objects
fragment_prob_per_burst = 0.0  # [guess] probability a burst fragments the target (0 = off). No published
                               # value: NASA OTPS 2024 and JAXA 2023 both say no systematic data exist.
                               # The melt gate (thermal_coupling, CLAUDE.md) gives a physical bound.
fragment_count_mean = 2.0      # [pick] fragments >= 1 cm per fragmentation (Poisson)
fragment_dv_sigma_m_s = 5.0    # [pick] per-axis fragment dv spread

[atmosphere]
model = "msis_table"           # msis_table (NRLMSIS 2.1 global mean vs F10.7) | exponential (static, legacy)
activity = "table"             # [sourced] table: ESA SOLMAG observed + forecast monthly F10.7
                               # (scripts/build_f107_table.py; gitignored) | cycle | constant
f107_table = ""                # "" = src/talos/data/f107_esa.npz
f107_constant = 130.0          # used when activity = "constant"
f107_min = 70.0                # [pick] smoothed cycle minimum (activity = "cycle")
f107_max = 155.0               # [pick] smoothed cycle maximum (cycle 25 ~150-165)
cycle_min_year = 2019.96       # cycle 25 minimum (Dec 2019)
cycle_max_year = 2024.8        # cycle 25 smoothed maximum (~Oct 2024)
cycle_period_yr = 11.0

[dynamics]
enabled = true                 # natural decay of the whole population + new debris
update_days = 1.0
source_mode = "replace_decays" # [assumption] un-lasered band in steady state: each natural decay of a
                               # never-engaged object is replaced by an identical one (fresh phases);
                               # "fraction" = background_frac_per_yr instead
background_frac_per_yr = 0.02  # [pick] "fraction" mode: new objects/yr as a fraction of n_real
breakup_rate_per_yr = 0.5      # [pick] breakups/yr in the band
breakup_fragments = 2000       # [pick] 1-10 cm fragments per breakup
breakup_dv_sigma_m_s = 50.0    # [pick] per-axis fragment dv spread
srp = true                     # [physics] solar radiation pressure on eccentricity (talos.srp); ~10x drag
                               # at 800 km for A/m ~ 2 m2/kg. Runs before 2026-11-11 had none.
srp_cr = 1.2                   # [pick] radiation pressure coefficient

[sun]
enabled = true                 # false: always sunlit, no sun gates
solar_constant_w_m2 = 1361.0
albedo = 0.30                  # [sourced] 0.20-0.35
array_pointing = "two_axis"    # [pick] two_axis | orbit_normal
fire_in_eclipse = false        # [pick] no firing from battery in shadow
lit_threshold = 0.5            # penumbra: sunlit when half the disc is visible
timeline_step_s = 10.0

[risk]
enabled = true                       # shell residence of engaged objects, natural vs lasered (talos.risk)
shell_names = ["crewed", "starlink", "band"]  # ISS ~415-420 + Tiangong ~380-390 km; Starlink 540-570; the 600-1000 km band
shell_lo_km = [370.0, 530.0, 600.0]
shell_hi_km = [430.0, 575.0, 1000.0]
# [pick] summed collision cross-section of the actives per shell: 2 stations ~1800 m2;
# ~6000 Starlink x ~40 m2; ~1500 satellites x ~10 m2 in 600-1000 km
shell_active_area_m2 = [1800.0, 240000.0, 15000.0]
v_rel_m_s = 10000.0                  # [pick] mean relative speed

[cost]                               # mass / life / cost per removal (talos.cost); all [pick]
radiator_kg_m2 = 10.0                # deployable radiator incl. loop (research: ~10 kg/m2)
array_w_kg = 100.0                   # solar array specific power incl. structure
laser_kg_per_kw = 20.0               # laser head + pumps + loop per kW optical
beam_director_kg = 300.0             # 1.5 m aperture + ATP
bus_fraction = 0.3                   # bus mass / payload mass
design_life_yr = 5.0
laser_rated_shots = 1.0e10           # pump diode / optics shot life
hardware_usd_per_kg = 50000.0
launch_usd_per_kg = 3000.0
ops_usd_per_sat_yr = 2000000.0
# station keeping: platforms fly fixed orbits in the sim; drag make-up is costed here
drag_cd = 2.2                        # free-molecular flat plate
drag_area_fixed_m2 = 10.0            # bus + beam director cross-section
drag_area_frac = 0.15                # share of array + radiator facing the flow (dawn-dusk SSO: near edge-on)
sk_isp_s = 1500.0                    # Hall thruster
sk_tank_fraction = 0.1               # tank + feed per kg propellant
propellant_usd_per_kg = 3000.0       # xenon / krypton

[knowledge]                          # orbit knowledge (talos.knowledge); all 0 = perfect knowledge
od_sigma_pos_m = 0.0                 # per-axis state-estimate error at burst start (track + laser
od_sigma_vel_m_s = 0.0               #   ranging: ~0.1 m / ~0.01 m/s, negligible; angles-only: much worse)
pointing_bias_rad = 0.0              # per-axis constant pointing offset over a burst

[survival]                           # debris impacts on the platforms (talos.survival); needs
                                     # scripts/build_platform_flux.py (ORDEM), else columns are NaN
enabled = true
lethal_size_m = 0.01                 # [sourced, weak] >= 1 cm destroys a spacecraft in LEO (SDC9 paper 330)
bus_area_m2 = 10.0                   # [pick] bus + beam director cross-section
radiator_crit_size_m = 0.001         # [pick] particle that punctures a radiator tube / manifold (unarmoured)
radiator_vulnerable_frac = 0.1       # [pick] tube + manifold share of radiator area
radiator_normal = "radial"           # [pick] zenith / nadir faces: ~1000x fewer hits than ram-facing
array_normal = "orbit_normal"        # dawn-dusk SSO, sun-tracking
